layout: {zmk_keyboard: tiny18_standalone_r}
layers:
  default: ['1', '2', '3', '4', '5', '6', '7', '8', '9']
  '1':
  - /
  - '`'
  - RIGHT ALT
  - SPACE
  - RIGHT GUI
  - {t: ▽, type: trans}
  - RIGHT SHIFT
  - ENTER
  - BACKSPACE
  '2':
  - {t: ▽, type: trans}
  - '|'
  - UP ARROW
  - BACKSPACE
  - LEFT
  - DOWN ARROW
  - RIGHT ARROW
  - TAB
  - Gui+ENTER
  '3':
  - +
  - {t: ▽, type: trans}
  - '4'
  - '*'
  - {t: ▽, type: trans}
  - RIGHT SHIFT
  - RIGHT GUI
  - '0'
  - .
  '4':
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - {type: held}
  - F12
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - F10
  - F11
  '5':
  - {t: BT, h: '0'}
  - {t: BT, h: '1'}
  - {t: BT, h: '2'}
  - {t: BT, h: '3'}
  - {t: BT, h: '4'}
  - BT CLR
  - OUT USB
  - OUT BLE
  - {t: default, h: toggle}
  solo_menu:
  - {type: held}
  - ''
  - {type: held}
  - {t: default, h: toggle}
  - {t: '1', h: toggle}
  - {t: '2', h: toggle}
  - {t: '3', h: toggle}
  - {t: '4', h: toggle}
  - {t: '5', h: toggle}
combos:
- p: [0, 2]
  k: solo_menu
